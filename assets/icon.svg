<!-- La icona de l'app, redibuixada per a mida de pestanya. És el mateix motiu
     —tres línies de guió amb la que s'està llegint en groc, i el botó de
     gravar— però amb les barres més gruixudes i menys marge: a 16 px les
     proporcions de la icona de 1024 es desfarien. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ReadToCam">
  <defs>
    <linearGradient id="fons" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262b"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#fons)"/>
  <g fill="#ffffff">
    <rect x="14" y="15" width="36" height="7" rx="3.5"/>
    <rect x="16" y="35" width="32" height="7" rx="3.5"/>
  </g>
  <rect x="11" y="25" width="42" height="7" rx="3.5" fill="#ffc74c"/>
  <circle cx="32" cy="51.5" r="6.5" fill="#e8382e"/>
</svg>
